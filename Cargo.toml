# rune-ui: Tailwind + shadcn for Rune. See README.md for the layers.
#
# Rune is pinned by git rev: the rev is written on every `rev =` line below and in `RUNE_REV`. Change them together.
[workspace]
resolver = "2"
members = ["crates/rune-ui-style", "crates/rune-ui-themes", "crates/rune-ui-cli", "apps/gallery"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "local"

[workspace.dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "bc05f817ed19488a10a6f1a928cc0521c1c70c75" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "bc05f817ed19488a10a6f1a928cc0521c1c70c75" }
rune-ui-style = { path = "crates/rune-ui-style" }
rune-ui-themes = { path = "crates/rune-ui-themes" }
serde_json = "1"

[workspace.lints.clippy]
too_many_arguments = "allow"

# Full debug info for Rune made test builds huge; line tables keep backtraces.
[profile.dev]
debug = "line-tables-only"

# Cargo does not inherit a dependency's patches. This is the table Rune's README requires, at the same rev.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "bc05f817ed19488a10a6f1a928cc0521c1c70c75" }
winit = { git = "https://github.com/anomalyco/rune", rev = "bc05f817ed19488a10a6f1a928cc0521c1c70c75" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "bc05f817ed19488a10a6f1a928cc0521c1c70c75" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "bc05f817ed19488a10a6f1a928cc0521c1c70c75" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "bc05f817ed19488a10a6f1a928cc0521c1c70c75" }
