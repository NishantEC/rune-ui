# rune-ui: Tailwind + shadcn for Rune. See README.md for the layers.
#
# Rune is pinned by git rev: the rev is written on every `rev =` line below and in `RUNE_REV`. Change them together.
[workspace]
resolver = "2"
members = ["crates/rune-ui-style", "crates/rune-ui-themes", "crates/rune-ui-cli", "apps/gallery"]

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/NishantEC/rune-ui"

[workspace.dependencies]
# Rune without its default features, so a library user is not made to take the Ogg audio decoders (symphonia and opuscule, MPL-2.0);
# rune-kit keeps its own defaults (syntax highlighting) and does not turn Rune's back on.
# An app that opens a window names the features it needs (see the gallery's Cargo.toml: everything Rune enables by default except
# `ogg-audio`); features unify, so an app that keeps Rune's defaults gets the audio crates back.
rune = { git = "https://github.com/anomalyco/rune", rev = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2", default-features = false }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2" }
rune-ui-style = { path = "crates/rune-ui-style" }
rune-ui-themes = { path = "crates/rune-ui-themes" }
serde_json = "1"

[workspace.lints.clippy]

# Full debug info for Rune made test builds huge; line tables keep backtraces.
[profile.dev]
debug = "line-tables-only"

# Cargo does not inherit a dependency's patches. This is the table Rune's README requires, at the same rev.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2" }
naga = { git = "https://github.com/anomalyco/rune", rev = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2" }
accesskit_atspi_common = { git = "https://github.com/anomalyco/rune", rev = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2" }
