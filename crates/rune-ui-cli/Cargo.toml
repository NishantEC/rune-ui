[package]
name = "rune-ui-cli"
description = "rune-ui's CLI: init, add, list, diff, update and registry hash. Copies registry sources into an app's src/ui/ and records versions and hashes in rune-ui.lock."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rune-ui"
path = "src/main.rs"

[dependencies]
# item.toml and rune-ui.lock (MIT OR Apache-2.0).
toml = "0.8"
# File hashes in item.toml and the lock (MIT OR Apache-2.0).
sha2 = "0.10"

[lints]
workspace = true

[dev-dependencies]
sha2 = "0.10"
