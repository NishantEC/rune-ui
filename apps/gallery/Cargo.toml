[package]
name = "gallery"
description = "Every rune-ui component in every state, light and dark; renders to PNGs headless (scripts/snap.sh)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "gallery"

[[bin]]
name = "gallery"
path = "src/main.rs"

[dependencies]
# Rune's default features are off in the workspace (so the MPL-2.0 Ogg audio crates are not in the lock file); these are all the
# ones Rune enables by default except `ogg-audio`. `tooling`: `--snap`, `--scene`, `--tree` in release builds too (debug builds always have them).
rune = { workspace = true, features = ["tooling", "accessibility", "dbus", "embedded-fonts", "hunspell", "metal-backend", "svg"] }
rune-kit = { workspace = true, features = ["markdown"] }
rune-ui-style.workspace = true
rune-ui-themes.workspace = true

[dev-dependencies]
png = "0.17"
serde_json.workspace = true
sha2 = "0.10"

[lints]
workspace = true
