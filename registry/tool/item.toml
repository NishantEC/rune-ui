# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "tool"
title = "Tool"
version = "0.9.0"
type = "component"
group = "agent"
description = "One tool call as one quiet line that reads like a sentence (status, its words or a whole line, a note, a duration from one second) that folds open to free words, its input and output."

[requires]
style = ">=0.6.0, <0.10.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons", "agent"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "tool.rs"
target = "src/ui/tool.rs"
sha256 = "dbfe0440e0e9dadeb679920aed88b9a9ed5810c3d4177944600fdd8fbbe5c084"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/tool.rs"
role = "story"
sha256 = "54bef0f24bbba95004fb9a1e8bf5e7b3978d64066e5c52155a0de5fa95b76c5f"
