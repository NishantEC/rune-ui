# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "tool"
title = "Tool"
version = "0.8.0"
type = "component"
group = "agent"
description = "One tool call as one quiet line (status, name, duration) that folds open to its input and output."

[requires]
style = ">=0.6.0, <0.9.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons", "agent"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "tool.rs"
target = "src/ui/tool.rs"
sha256 = "3f40a83a2da293aa9aa44ef69aeb8e298f61efa6d2a99bc42b885c5d426e8bbc"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/tool.rs"
role = "story"
sha256 = "e58046a34cc9e0ae54a6052bcac4cbace0845911e2698f39cea411adafb362f0"
