# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "font_plus_jakarta_sans"
title = "Plus Jakarta Sans"
version = "0.8.0"
type = "font"
group = "fonts"
description = "A wide, modern sans with tall capitals and a confident, product-site feel. Variable weight 200 to 800."

[requires]
style = ">=0.5.0, <0.11.0"
