# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "dialog"
title = "Dialog"
version = "0.10.0"
type = "component"
group = "overlays"
description = "A modal panel over a scrim: focus trapped, Escape and a press outside close it."

[requires]
style = ">=0.10.0, <0.11.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons", "button"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = ["button", "input"]

[[files]]
path = "dialog.rs"
target = "src/ui/dialog.rs"
sha256 = "270afad3a126bd498e9d22198be44dae1193dbeaa3df8bffcc2c8866029621b8"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/dialog.rs"
role = "story"
sha256 = "16a53f2e0932b06086d47334460a66629e034849475084c4d7b31cbb7b737987"
