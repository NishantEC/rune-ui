# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "dialog"
title = "Dialog"
version = "0.11.0"
type = "component"
group = "overlays"
description = "A modal panel over a scrim: focus trapped, Escape and a press outside close it; the body can scroll between a fixed header and footer."

[requires]
style = ">=0.10.0, <0.11.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons", "button"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = ["button", "input"]

[[files]]
path = "dialog.rs"
target = "src/ui/dialog.rs"
sha256 = "3d9dfe42f5c1b19e4ed13e3c8dffc4ca7e3578b0f97ae9b75d3b1da90cffa45b"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/dialog.rs"
role = "story"
sha256 = "14341eee65e53095b3b077e5f7475e1526bc21544090676b53a8d2cea5656c4d"
