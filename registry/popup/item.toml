# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "popup"
title = "Popup"
version = "0.10.0"
type = "base"
group = "base"
description = "The floating list Select, DropdownMenu, ContextMenu and Combobox open: anchored at the trigger's left edge and width, rows with a highlight that follows pointer and keys, typeahead, Escape and Tab to close."

[requires]
style = ">=0.10.0, <0.12.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style", "rune-kit"]

[[files]]
path = "popup.rs"
target = "src/ui/popup.rs"
sha256 = "13a860a401e3e863452494dea659d24c982d0cb60c3482ec3e9842c2671b1ddf"
