# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "stack_trace"
title = "StackTrace"
version = "0.8.0"
type = "component"
group = "agent"
description = "An error and its frames: app frames in the first ink, library frames folded and faint; pressing a frame hands path, line and column to the app; Copy."

[requires]
style = ">=0.8.0, <0.10.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons", "agent"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "stack_trace.rs"
target = "src/ui/stack_trace.rs"
sha256 = "739fd14a0fe825b3a7fa4396986034737773a6a7b47c3362d3175167d5047b8f"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/stack_trace.rs"
role = "story"
sha256 = "c7581ebabc1078084684e0854c1367c9fe1272ec010ce7ace291200d6d91ec6b"
