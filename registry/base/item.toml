# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "base"
title = "Base"
version = "0.2.0"
type = "base"
group = "base"
description = "Shared helpers: press type, size metrics, hit area, glyph, spinner, words beside a control."

[requires]
style = ">=0.2.0, <0.3.0"
rune = "bc05f817ed19488a10a6f1a928cc0521c1c70c75"

[dependencies]
registry = ["icons"]
cargo = ["rune", "rune-ui-style", "rune-kit"]

[[files]]
