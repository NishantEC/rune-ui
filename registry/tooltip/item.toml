# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "tooltip"
title = "Tooltip"
version = "0.4.0"
type = "component"
group = "overlays"
description = "A short ink label on hover or focus, from rune-kit's tooltip behaviour."

[requires]
style = ">=0.4.0, <0.5.0"
rune = "bc05f817ed19488a10a6f1a928cc0521c1c70c75"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style", "rune-kit"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = ["button"]

[[files]]
path = "tooltip.rs"
target = "src/ui/tooltip.rs"
sha256 = "d288b47f6c51f01b32c603a22d373269ce807b6035533e989b64dc2c573e776e"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/tooltip.rs"
role = "story"
sha256 = "3d91e6526d2463f1bb2ef90b9f1d169c7aa8e45cd5ca59fbfce118a7b9e33ec3"
