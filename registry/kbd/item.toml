# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "kbd"
title = "Kbd"
version = "0.11.0"
type = "component"
group = "display"
description = "Keys as small raised caps in the theme's keycap face; the modifier keys are drawn as icons so no font has to carry them."

[requires]
style = ">=0.10.0, <0.12.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "kbd.rs"
target = "src/ui/kbd.rs"
sha256 = "13e0c638c947b3cd15ca67d640a635eb9e5f6a179e7a5139af67e00b903cc64b"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/kbd.rs"
role = "story"
sha256 = "66285b39425dfa7a62b9b35c446ead25b25dc6ec125e12e9a044abf2accb7b5d"
