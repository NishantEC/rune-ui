# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "kbd"
title = "Kbd"
version = "0.10.0"
type = "component"
group = "display"
description = "Keys as small raised caps."

[requires]
style = ">=0.10.0, <0.11.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "kbd.rs"
target = "src/ui/kbd.rs"
sha256 = "c94146b813cd37bed8eea113f241a4a7072657e9bc22bbb1347f31d96fbc7a80"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/kbd.rs"
role = "story"
sha256 = "9062deea3e0022405ee9f38f02119666f86a085c68d666a98d8547e7ae1ef728"
