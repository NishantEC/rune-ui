# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "checkpoint"
title = "Checkpoint"
version = "0.8.0"
type = "component"
group = "agent"
description = "A divider in the conversation where work was saved, with a Restore button."

[requires]
style = ">=0.6.0, <0.12.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "checkpoint.rs"
target = "src/ui/checkpoint.rs"
sha256 = "722437479a71c42c11f300b0aac956c2f90f2ebcb94e335c41612eff82e41681"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/checkpoint.rs"
role = "story"
sha256 = "fdd32c40c502795d6ce3fc34ffb16752af16750975fc0f809f036df1eea5af63"
