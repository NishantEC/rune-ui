# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "spinner"
title = "Spinner"
version = "0.2.0"
type = "component"
group = "display"
description = "Work in progress: a turning ring, the one thing that loops."

[requires]
style = ">=0.2.0, <0.3.0"
rune = "bc05f817ed19488a10a6f1a928cc0521c1c70c75"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "spinner.rs"
target = "src/ui/spinner.rs"
sha256 = "a47228816a786641446775f4ccc6c30d37538795152eeec42f2e00bbb2788ea1"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/spinner.rs"
role = "story"
sha256 = "5cfab4e26b26a4652e7eb500f31b9202c28b224312f2dee3b6c2306d170ffe4e"
