# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "popover"
title = "Popover"
version = "0.3.0"
type = "component"
group = "overlays"
description = "A floating panel beside its trigger; a press outside or Escape closes it."

[requires]
style = ">=0.3.0, <0.4.0"
rune = "bc05f817ed19488a10a6f1a928cc0521c1c70c75"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style", "rune-kit"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = ["button", "switch"]

[[files]]
path = "popover.rs"
target = "src/ui/popover.rs"
sha256 = "6818362134e838b40a1bc3a11853d09968b32fa965f451818ff68f14b47202d3"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/popover.rs"
role = "story"
sha256 = "a5037074ff57148701cc9a968fcdcc96494bffb004d075641a7c5771073c79b1"
