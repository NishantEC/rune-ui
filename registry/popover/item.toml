# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "popover"
title = "Popover"
version = "0.5.0"
type = "component"
group = "overlays"
description = "A floating panel beside its trigger; a press outside or Escape closes it."

[requires]
style = ">=0.5.0, <0.7.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style", "rune-kit"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = ["button", "switch"]

[[files]]
path = "popover.rs"
target = "src/ui/popover.rs"
sha256 = "adb5598c998e47b1544e809d7fcee5c22fe4f07d393b4e61463c0078544d72cc"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/popover.rs"
role = "story"
sha256 = "a5037074ff57148701cc9a968fcdcc96494bffb004d075641a7c5771073c79b1"
