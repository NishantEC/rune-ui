# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "toast"
title = "Toast"
version = "0.5.0"
type = "component"
group = "display"
description = "A short message on the floating material, with an action; a region to stack them."

[requires]
style = ">=0.5.0, <0.10.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons", "button"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "toast.rs"
target = "src/ui/toast.rs"
sha256 = "48592754d8383280dcc595782bde8ca5a1948ff7ad2c963d4156c7e5d7d204a2"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/toast.rs"
role = "story"
sha256 = "91d743d01d5ad837154b79a84487f61cc2fedca18eccc9af2187b1a34d83c605"
