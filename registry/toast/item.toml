# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "toast"
title = "Toast"
version = "0.11.0"
type = "component"
group = "display"
description = "A short message on the floating material with one action and a close button; a stack at the bottom (trailing or centre) and a host that times, pauses and dismisses them."

[requires]
style = ">=0.5.0, <0.11.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons", "button"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "toast.rs"
target = "src/ui/toast.rs"
sha256 = "2d00aaa05147da4d4408e60d8e33f6acf8fe422e02cf4bf9db0f23fa0481f651"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/toast.rs"
role = "story"
sha256 = "5a631de652bf16e77982357d1d76399dd74019c9c7644a73b90b6bdc1f7d65c4"
