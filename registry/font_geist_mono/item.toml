# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "font_geist_mono"
title = "Geist Mono"
version = "0.8.0"
type = "font"
group = "fonts"
description = "Geist's monospaced companion, for code, keys and tables of figures. Variable weight 100 to 900."

[requires]
style = ">=0.5.0, <0.9.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
# Rune replaces its built-in Inter with an app's own fonts, so every font brings Inter along.
registry = ["font_inter"]
cargo = ["rune-ui-style"]

[font]
token = "geist-mono"
family = "Geist Mono"
licence = "OFL-1.1"
font_version = "Version 1.701"
source = "https://github.com/google/fonts/tree/83c62e30d87daa70216dab6b984d00d20d96d585/ofl/geistmono/GeistMono%5Bwght%5D.ttf"
upstream = "https://github.com/vercel/geist-font"
bytes = 171948
size_adjust = 1.03

[[files]]
path = "font_geist_mono.rs"
target = "src/ui/font_geist_mono/mod.rs"
sha256 = "79789470d57683e970562da9f532d580ab18e4f8473a85e35a84a4e61b597566"

