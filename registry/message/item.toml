# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "message"
title = "Message"
version = "0.10.0"
type = "component"
group = "agent"
description = "One turn: a person's quiet bubble at the right, or the agent's words on the page in a reading column; an avatar, attachments and actions, which can show only on hover or focus."

[requires]
style = ">=0.6.0, <0.12.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = ["attachment", "avatar", "actions", "portrait"]

[[files]]
path = "message.rs"
target = "src/ui/message.rs"
sha256 = "6a9be7776cb9db7fb2dd399f0be9de9a388e0fd08035e78de15c27f9cdbb1ac7"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/message.rs"
role = "story"
sha256 = "88268a66610b52ebd017726a88f6d6f069699617eeee33e47a933871fe0d2462"
