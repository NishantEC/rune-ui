# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "reasoning"
title = "Reasoning"
version = "0.6.0"
type = "component"
group = "agent"
description = "Thinking\u2026 with a shimmer while the model thinks, then a Thought for 12s fold."

[requires]
style = ">=0.6.0, <0.7.0"
rune = "bc05f817ed19488a10a6f1a928cc0521c1c70c75"

[dependencies]
registry = ["base", "icons", "agent", "shimmer"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "reasoning.rs"
target = "src/ui/reasoning.rs"
sha256 = "3ebbf657431c9345903cc2e91099d279a75805d098277a1ede1dfe1e899c48a4"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/reasoning.rs"
role = "story"
sha256 = "b3bfba6d3f88a06f551c599601777b0edef1d8c9cae0e70ef1a94dd37bbdb86f"
