# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "select"
title = "Select"
version = "0.6.0"
type = "component"
group = "form"
description = "One choice of a few: a well trigger over rune-kit's listbox behaviour."

[requires]
style = ">=0.5.0, <0.9.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons", "popup"]
cargo = ["rune", "rune-ui-style", "rune-kit"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "select.rs"
target = "src/ui/select.rs"
sha256 = "1bb06200d8eaf55351631b742ac58d141e730b593329cc046663ac3611a19ed3"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/select.rs"
role = "story"
sha256 = "ad3ce05204569bad463ad2e4d9eeb3a93efea12a776e877d5e716ac5a4482d93"
