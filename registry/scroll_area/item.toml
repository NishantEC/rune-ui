# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "scroll_area"
title = "ScrollArea"
version = "0.3.0"
type = "component"
group = "structure"
description = "A region that scrolls inside a fixed height, its edges fading."

[requires]
style = ">=0.3.0, <0.4.0"
rune = "bc05f817ed19488a10a6f1a928cc0521c1c70c75"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "scroll_area.rs"
target = "src/ui/scroll_area.rs"
sha256 = "7c8baf53636f02669e312a3b5348cf26e17d41f61d659fa96739e2aa010bdede"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/scroll_area.rs"
role = "story"
sha256 = "279e20c324d92b9f560d7b39d4a4dae2f9e8a3e426d7880211f554088c6770f5"
