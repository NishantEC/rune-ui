# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "font_manrope"
title = "Manrope"
version = "0.8.0"
type = "font"
group = "fonts"
description = "A semi-condensed geometric sans with open, modern shapes. Variable weight 200 to 800."

[requires]
style = ">=0.5.0, <0.8.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
# Rune replaces its built-in Inter with an app's own fonts, so every font brings Inter along.
registry = ["font_inter"]
cargo = ["rune-ui-style"]

[font]
token = "manrope"
family = "Manrope"
licence = "OFL-1.1"
font_version = "Version 4.505"
source = "https://github.com/google/fonts/tree/83c62e30d87daa70216dab6b984d00d20d96d585/ofl/manrope/Manrope%5Bwght%5D.ttf"
upstream = "https://github.com/googlefonts/manrope"
bytes = 164700
size_adjust = 1.0

[[files]]
path = "font_manrope.rs"
target = "src/ui/font_manrope/mod.rs"
sha256 = "144ca7995c1801416f0ef41d7e2c781f2b1ced1a6ba7899ddaa8d708cb607346"

[[files]]
