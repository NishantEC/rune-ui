# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "command"
title = "Command"
version = "0.3.0"
type = "component"
group = "overlays"
description = "A command palette: a search over grouped commands, moved through with the keys, in a dialog or inline."

[requires]
style = ">=0.3.0, <0.4.0"
rune = "bc05f817ed19488a10a6f1a928cc0521c1c70c75"

[dependencies]
registry = ["base", "icons", "kbd"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = ["button"]

[[files]]
path = "command.rs"
target = "src/ui/command.rs"
sha256 = "3e92e49ee85bfe399839496a7c47bb25e921679c7004a7f540aaa6d28bbe6f33"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/command.rs"
role = "story"
sha256 = "481f2ce709497c6693d230c5e482bc0439d98533c3ecc2ad98d6aa4d03fb7c45"
