# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "command"
title = "Command"
version = "0.11.0"
type = "component"
group = "overlays"
description = "A command palette: grouped results with a leading element, subtitle, hint and shortcut, fuzzy matching with the matched letters marked, recents, a loading state and an alternate choice."

[requires]
style = ">=0.10.0, <0.11.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons", "kbd"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = ["button"]

[[files]]
path = "command.rs"
target = "src/ui/command.rs"
sha256 = "8d649e57b8eab18dda602c27883bef349c8c0c658c87fa4155ff897ba78a967a"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/command.rs"
role = "story"
sha256 = "776bd9240c0c26a6dd4c25ec5d8407a4a89f3ae37d601c679b523aff7bcd56af"
