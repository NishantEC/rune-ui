# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "command"
title = "Command"
version = "0.2.0"
type = "component"
group = "overlays"
description = "A command palette: a search over grouped commands, moved through with the keys, in a dialog or inline."

[requires]
style = ">=0.2.0, <0.3.0"
rune = "bc05f817ed19488a10a6f1a928cc0521c1c70c75"

[dependencies]
registry = ["base", "icons", "kbd"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = ["button"]

[[files]]
path = "command.rs"
target = "src/ui/command.rs"
sha256 = "9108687ae20edd3ea70052096cc57e7f4385ee55de7f9db07d472ff606d13650"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/command.rs"
role = "story"
sha256 = "49e91944553519fc85a592ec3774fefeffc31908571d665c9e90be14c1595166"
