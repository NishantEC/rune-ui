# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "file_tree"
title = "FileTree"
version = "0.8.0"
type = "component"
group = "structure"
description = "A Tree made from file paths: folders first in natural order, an icon per file kind, folders that open, figures per file."

[requires]
style = ">=0.8.0, <0.10.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons", "tree"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "file_tree.rs"
target = "src/ui/file_tree.rs"
sha256 = "cbd0a468cbc9748d8bbc9c7130f5ec67b526d882f45317b71a5ce54d0b4dae5a"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/file_tree.rs"
role = "story"
sha256 = "27925bb0e5f16e0859a73c206e88638620a1a10cb955f195d855aba7efc2d888"
