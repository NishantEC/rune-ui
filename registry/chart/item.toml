# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "chart"
title = "Chart"
version = "0.5.1"
type = "component"
group = "display"
description = "Line, bar, area and donut charts drawn with Rune shapes in the theme's series colours: nice axes, grid, legend, a hover tooltip on the overlay layer."

[requires]
style = ">=0.5.1, <0.6.0"
rune = "bc05f817ed19488a10a6f1a928cc0521c1c70c75"

[dependencies]
registry = ["base"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "chart.rs"
target = "src/ui/chart.rs"
sha256 = "d388b5417c78b46f83a1aec417d8246b969ca90a86c1633cfc4d3425b5473e63"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/chart.rs"
role = "story"
sha256 = "4ae0a84136813b7024aa37e15bc10c3863966a800835169f6f1a75df23f2412f"
