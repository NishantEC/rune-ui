# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "button"
title = "Button"
version = "0.2.0"
type = "component"
group = "actions"
description = "Default (ink), secondary (raised), outline, ghost, destructive and link; three sizes; icon, loading, selected."

[requires]
style = ">=0.2.0, <0.3.0"
rune = "bc05f817ed19488a10a6f1a928cc0521c1c70c75"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]

