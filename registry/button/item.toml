# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "button"
title = "Button"
version = "0.8.0"
type = "component"
group = "actions"
description = "Default (ink), secondary (raised), outline, ghost, destructive and link; three sizes; icon, loading, selected."

[requires]
style = ">=0.8.0, <0.10.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "button.rs"
target = "src/ui/button.rs"
sha256 = "fa2dbbe1a4fa452409afcae4049048d5fe73d3ad85617ae7e86dc83f11f8095c"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/button.rs"
role = "story"
sha256 = "2cfd8f49d6e1a80155c18203287e8feadc37a66d047261aea988ee6ce84e463a"
