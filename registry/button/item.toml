# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "button"
title = "Button"
version = "0.4.0"
type = "component"
group = "actions"
description = "Default (ink), secondary (raised), outline, ghost, destructive and link; three sizes; icon, loading, selected."

[requires]
style = ">=0.4.0, <0.5.0"
rune = "bc05f817ed19488a10a6f1a928cc0521c1c70c75"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "button.rs"
target = "src/ui/button.rs"
sha256 = "4f91de12aad927b82cfd169feb8bb9240c241d2c201da44f7d71e6c60c24247d"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/button.rs"
role = "story"
sha256 = "2cfd8f49d6e1a80155c18203287e8feadc37a66d047261aea988ee6ce84e463a"
