# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "action_bar"
title = "ActionBar"
version = "0.8.0"
type = "component"
group = "actions"
description = "A floating bar of bulk actions for a selection: the count, the actions, Clear; one Tab stop, arrows inside, Escape clears; rises from the bottom in the overlay layer."

[requires]
style = ">=0.8.0, <0.12.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons", "button"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = ["data_table"]

[[files]]
path = "action_bar.rs"
target = "src/ui/action_bar.rs"
sha256 = "e0fa031d3dcfa458f1d90fa06b765c6e45bcb6dbbac6ef48cefa89b573f530c6"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/action_bar.rs"
role = "story"
sha256 = "53487213718c991f27c20bbdd01e217d8a6b59cc69bb5212563b8549830bc5b9"
