# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "gallery"
title = "Gallery"
version = "0.5.1"
type = "block"
group = "blocks"
description = "A page showing every installed component's stories: group tabs, variants by states, light/dark and density switches, a materials sheet."

[requires]
style = ">=0.5.0, <0.8.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style", "rune-kit"]

[[files]]
path = "gallery.rs"
target = "src/ui/gallery.rs"
sha256 = "a2f588e9b7a01c82d95a50a50be13ef6c1bb01fe2e76ea4d73fc0b71ef9802d5"
