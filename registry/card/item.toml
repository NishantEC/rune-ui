# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "card"
title = "Card"
version = "0.5.0"
type = "component"
group = "structure"
description = "A slab of rows split by inset hairlines, or a raised card; header, content, footer."

[requires]
style = ">=0.5.0, <0.7.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons", "separator"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = ["button", "switch"]

[[files]]
path = "card.rs"
target = "src/ui/card.rs"
sha256 = "ee3f0a5171b1cbd9bb45132dc9847625a80b2383c032f6b06a0f1d66b5904751"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/card.rs"
role = "story"
sha256 = "a2b03600cb24b5edc02e0cfbc96f824d5c6c448cf63a6e91ec87137a925bfcde"
