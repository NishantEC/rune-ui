# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "breadcrumb"
title = "Breadcrumb"
version = "0.3.0"
type = "component"
group = "structure"
description = "Where you are: links to the places above, the current page last."

[requires]
style = ">=0.3.0, <0.4.0"
rune = "bc05f817ed19488a10a6f1a928cc0521c1c70c75"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "breadcrumb.rs"
target = "src/ui/breadcrumb.rs"
sha256 = "9cf0efd45a7e90aa07c7659d8a5b2d1bb75ebb42bfff27e7b4595a20c70c15fa"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/breadcrumb.rs"
role = "story"
sha256 = "897a8142117b8dfba44fb4c327c6f2fdb6ac411b99ed67051ca7bc37e4aaa122"
