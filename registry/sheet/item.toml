# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "sheet"
title = "Sheet"
version = "0.10.0"
type = "component"
group = "overlays"
description = "A panel that slides in from an edge over a scrim."

[requires]
style = ">=0.10.0, <0.12.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = ["button"]

[[files]]
path = "sheet.rs"
target = "src/ui/sheet.rs"
sha256 = "e2495c8b6c6b6058c5d2e279e5184a38db5f5c8204e474bd96d3c11bf98d23cb"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/sheet.rs"
role = "story"
sha256 = "c2a23849b1e86666e989f22e91c03c97b991d3777735c0d46730b1bef1779064"
