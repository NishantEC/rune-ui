# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "checkbox"
title = "Checkbox"
version = "0.2.0"
type = "component"
group = "form"
description = "On, off or mixed: a small well that fills with ink, with words beside it."

[requires]
style = ">=0.2.0, <0.3.0"
rune = "bc05f817ed19488a10a6f1a928cc0521c1c70c75"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "checkbox.rs"
target = "src/ui/checkbox.rs"
sha256 = "020592455417232aa731c1c0032b60023061fcc02b1a1adda8fc811b1bc29253"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/checkbox.rs"
role = "story"
sha256 = "94d85c5fb9cb20ff80289a57d526212316bec6640f53d79e6209298f236b5ff9"
