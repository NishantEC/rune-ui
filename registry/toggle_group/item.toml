# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "toggle_group"
title = "ToggleGroup"
version = "0.5.0"
type = "component"
group = "actions"
description = "One or several of a few toggles: a well track holding raised choices."

[requires]
style = ">=0.5.0, <0.7.0"
rune = "bc05f817ed19488a10a6f1a928cc0521c1c70c75"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "toggle_group.rs"
target = "src/ui/toggle_group.rs"
sha256 = "2bc9b00d31dc6d94615267c2276c0712308f6979a3c0612edbb4cf4b14d4eb21"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/toggle_group.rs"
role = "story"
sha256 = "2503fc3454552d575ea681bdd65c636c98687f35c2ae82e02cb01472c3b5fb4d"
