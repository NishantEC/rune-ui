# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "input"
title = "Input"
version = "0.4.0"
type = "component"
group = "form"
description = "A one-line text field on the well material, with prefix, suffix, clear and a search form."

[requires]
style = ">=0.4.0, <0.5.0"
rune = "bc05f817ed19488a10a6f1a928cc0521c1c70c75"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "input.rs"
target = "src/ui/input.rs"
sha256 = "8857dfe3c5c02a731a2934f22ef95fc07b9ad35fb9ca1edd4799641bb959388b"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/input.rs"
role = "story"
sha256 = "92d1131fe4a08255b725f366de254897ee94d5144d512575d00a68c06c0ccc6d"
