# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "input"
title = "Input"
version = "0.5.0"
type = "component"
group = "form"
description = "A one-line text field on the well material, with prefix, suffix, clear and a search form."

[requires]
style = ">=0.5.0, <0.7.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "input.rs"
target = "src/ui/input.rs"
sha256 = "eadd71e6ef1b47c9fd301480b71f16a0241d3e23231bff869df77a254d6cd459"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/input.rs"
role = "story"
sha256 = "92d1131fe4a08255b725f366de254897ee94d5144d512575d00a68c06c0ccc6d"
