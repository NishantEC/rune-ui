# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "model_selector"
title = "ModelSelector"
version = "0.6.0"
type = "component"
group = "agent"
description = "Models grouped by provider in a searchable floating panel anchored to its trigger, with a tier or price per row."

[requires]
style = ">=0.6.0, <0.7.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-kit", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "model_selector.rs"
target = "src/ui/model_selector.rs"
sha256 = "da68bacd2a3e3455f2e24e9f9799bb665b23eeff4b40e42f32b8d4f24481bbeb"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/model_selector.rs"
role = "story"
sha256 = "a70150de2acbd82b972376e8befece3ec21adbb7f0aa79662be3e92d708f38d5"
