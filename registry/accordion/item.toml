# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "accordion"
title = "Accordion"
version = "0.3.0"
type = "component"
group = "structure"
description = "Sections that fold, one or several open."

[requires]
style = ">=0.3.0, <0.4.0"
rune = "bc05f817ed19488a10a6f1a928cc0521c1c70c75"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "accordion.rs"
target = "src/ui/accordion.rs"
sha256 = "cb44752b5bd6b438f052161a95df01268f4411ec8300ba4537683b577b9b8b7c"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/accordion.rs"
role = "story"
sha256 = "b3b347ed9a844e5abdb08b46f23b61072a1fdfc133f5aa5a526da43ba6510c57"
