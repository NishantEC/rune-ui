# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "accordion"
title = "Accordion"
version = "0.5.0"
type = "component"
group = "structure"
description = "Sections that fold, one or several open."

[requires]
style = ">=0.5.0, <0.11.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "accordion.rs"
target = "src/ui/accordion.rs"
sha256 = "e7ac626a2da806279aa5c924607e77b9555766715e745d71d524ed93b323ced1"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/accordion.rs"
role = "story"
sha256 = "b3b347ed9a844e5abdb08b46f23b61072a1fdfc133f5aa5a526da43ba6510c57"
