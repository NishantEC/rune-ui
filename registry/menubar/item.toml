# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "menubar"
title = "Menubar"
version = "0.6.0"
type = "component"
group = "overlays"
description = "A row of menus on the shared popup: Left/Right between titles and between open menus, Down/Return to open, Escape back to the title."

[requires]
style = ">=0.5.1, <0.9.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons", "popup"]
cargo = ["rune", "rune-ui-style", "rune-kit"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "menubar.rs"
target = "src/ui/menubar.rs"
sha256 = "219fb6adb2b1eb61e6bbaf477eb6167be707a5fdeae4566c7667d92200b5f7b8"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/menubar.rs"
role = "story"
sha256 = "7ddb47bc6b3dbf8d2d893fb6e43bf2f61255fdaa9d8a2198ee6d1a59f30520d9"
