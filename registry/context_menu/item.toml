# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "context_menu"
title = "ContextMenu"
version = "0.5.0"
type = "component"
group = "overlays"
description = "A menu at the pointer on a right-click: rune-kit's context menu in our look."

[requires]
style = ">=0.5.0, <0.6.0"
rune = "bc05f817ed19488a10a6f1a928cc0521c1c70c75"

[dependencies]
registry = ["base", "icons", "popup"]
cargo = ["rune", "rune-ui-style", "rune-kit"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "context_menu.rs"
target = "src/ui/context_menu.rs"
sha256 = "d287b67c0377c1392035df75f72f677f0d777d61b62667eb6914d1ed4e47c69d"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/context_menu.rs"
role = "story"
sha256 = "69be73bbfe178513b9024e31e16514cdc9291e78d589d713a6896cf6c155b557"
