# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "drawer"
title = "Drawer"
version = "0.5.1"
type = "component"
group = "overlays"
description = "A bottom sheet on Sheet's machinery: grab bar, centred title, full-width actions; slides up, drag the bar down, Escape or press outside to close."

[requires]
style = ">=0.5.1, <0.6.0"
rune = "bc05f817ed19488a10a6f1a928cc0521c1c70c75"

[dependencies]
registry = ["base", "sheet"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = ["button"]

[[files]]
path = "drawer.rs"
target = "src/ui/drawer.rs"
sha256 = "8d8ca7e3fc244ffadd656f7dae872bd7d46bfc67327ff22061768c82900b3986"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/drawer.rs"
role = "story"
sha256 = "176e832456d7bbeb548729e8a2844b3276f13aa9cce7a6482f83b3a4d6daafe5"
