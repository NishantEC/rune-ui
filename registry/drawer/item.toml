# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "drawer"
title = "Drawer"
version = "0.8.0"
type = "component"
group = "overlays"
description = "A bottom sheet on Sheet's machinery: grab bar, centred title, full-width actions; slides up, drag the bar down, Escape or press outside to close."

[requires]
style = ">=0.8.0, <0.10.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "sheet"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = ["button"]

[[files]]
path = "drawer.rs"
target = "src/ui/drawer.rs"
sha256 = "fc34fb76c4688d7d5f4219ec3c9f6c67313e8400ca5f121f759b71c21982e318"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/drawer.rs"
role = "story"
sha256 = "a4f887825a85ffd728c8dd31757dfe4af70145b2318bc06b07ffaf990f7eec0b"
