# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "form"
title = "Form"
version = "0.5.1"
type = "component"
group = "form"
description = "A form around Fields: title, required and optional marks, validation messages and checks, a status line, Cancel and a submit that spins."

[requires]
style = ">=0.5.1, <0.6.0"
rune = "bc05f817ed19488a10a6f1a928cc0521c1c70c75"

[dependencies]
registry = ["base", "icons", "field", "button"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = ["input"]

[[files]]
path = "form.rs"
target = "src/ui/form.rs"
sha256 = "95483dac051a79611e94ff7bc97f3941b7699dc7eb30e03e8d1062372f926926"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/form.rs"
role = "story"
sha256 = "9ead319f0c09effe27daad3f8176d4aa2e065749c3e931747b35529a79d4fded"
