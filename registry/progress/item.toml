# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "progress"
title = "Progress"
version = "0.3.0"
type = "component"
group = "display"
description = "How far along: a well track with an ink fill, figures tabular."

[requires]
style = ">=0.3.0, <0.4.0"
rune = "bc05f817ed19488a10a6f1a928cc0521c1c70c75"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "progress.rs"
target = "src/ui/progress.rs"
sha256 = "e288775ed4a15f291b5cbe55c16a4d8e2d8cc86233bfbe975576574611796ea1"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/progress.rs"
role = "story"
sha256 = "74acc166702449ecf0681410292217cf53c65983233927167567eb436e4f2962"
