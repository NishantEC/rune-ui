# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "progress"
title = "Progress"
version = "0.5.0"
type = "component"
group = "display"
description = "How far along: a well track with an ink fill, figures tabular."

[requires]
style = ">=0.5.0, <0.12.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "progress.rs"
target = "src/ui/progress.rs"
sha256 = "8c0427bbdf35dd82a66ef0e03111202f42f4aec1f6c5d62279991f0e4bf7d4ae"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/progress.rs"
role = "story"
sha256 = "74acc166702449ecf0681410292217cf53c65983233927167567eb436e4f2962"
