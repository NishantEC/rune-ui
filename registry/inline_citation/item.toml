# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "inline_citation"
title = "InlineCitation"
version = "0.6.0"
type = "component"
group = "agent"
description = "A small chip inside an answer naming its source, with a hover card from the overlay layer."

[requires]
style = ">=0.6.0, <0.7.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons", "hover_card"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "inline_citation.rs"
target = "src/ui/inline_citation.rs"
sha256 = "1e0532767f9f07f11237ff8be04c86eccba5f97b488356c6b791ddaf5c8e8b5e"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/inline_citation.rs"
role = "story"
sha256 = "eda75fd9ab019e9f1d08ac13de662e9b65acde912d411bbbee50f854d755b511"
