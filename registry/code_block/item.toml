# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "code_block"
title = "CodeBlock"
version = "0.8.0"
type = "component"
group = "agent"
description = "Code on the slab: language, Copy, optional line numbers, sideways scroll, colour from Rune's built-in highlighter."

[requires]
style = ">=0.6.0, <0.10.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons", "agent"]
cargo = ["rune", "rune-kit", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "code_block.rs"
target = "src/ui/code_block.rs"
sha256 = "ee787a4f9db102ce400faae5bb2e35c4e20589682005981cb9f40192fbf20640"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/code_block.rs"
role = "story"
sha256 = "db790a2cf315f2e0c1a29fa2d6dddd5e89ef597955b58174a5c94c3dd190af7b"
