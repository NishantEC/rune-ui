# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "chat"
title = "Chat"
version = "0.9.0"
type = "block"
group = "agent"
description = "A full agent screen made of the agent set: a conversation with messages, reasoning, tools, a permission request and the composer."

[requires]
style = ">=0.6.0, <0.10.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons", "agent", "conversation", "message", "response", "reasoning", "tool", "confirmation", "prompt_input", "model_selector", "actions", "chain_of_thought", "attachment"]
cargo = ["rune", "rune-kit", "rune-ui-style"]
# Cargo features the item needs; `rune-ui add` turns them on in the app's Cargo.toml.
features = ["rune-kit/markdown"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "chat.rs"
target = "src/ui/chat.rs"
sha256 = "4da5a8aacee3ac970a9da2faeb060150b55b9c2b52db12f02ee256dd96194b24"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/chat.rs"
role = "story"
sha256 = "6ac93c69003081148c37e3728df08a08d9e778d30f38bae583d39bf787519784"
