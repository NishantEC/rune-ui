# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "context"
title = "Context"
version = "0.9.0"
type = "component"
group = "agent"
description = "A token and cost meter: a ring (or a bar) and a share, with a popover breakdown (used, window, in, out, cached, cost, a note) from the overlay layer."

[requires]
style = ">=0.6.0, <0.10.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "agent"]
cargo = ["rune", "rune-kit", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "context.rs"
target = "src/ui/context.rs"
sha256 = "ee40d33e63da91e9f3613fe1bc43517016aecb0846bd20f48173115540b5c105"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/context.rs"
role = "story"
sha256 = "90770805e308c5abe413a37f31fed94d3ece5faacadbeb066fc0afb308a8d1cd"
