# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "context"
title = "Context"
version = "0.6.0"
type = "component"
group = "agent"
description = "A token and cost meter: a bar and a share, with a popover breakdown from the overlay layer."

[requires]
style = ">=0.6.0, <0.8.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "agent"]
cargo = ["rune", "rune-kit", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "context.rs"
target = "src/ui/context.rs"
sha256 = "39aa85cc922dc4cadd80f105d0a72f33571a00356f91af66f71cabc85a47f050"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/context.rs"
role = "story"
sha256 = "bcee1f08edbab3cbb99de7a6ebcbcfffc768590da2b3defddea7c31a6f9afc29"
