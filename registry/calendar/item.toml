# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "calendar"
title = "Calendar"
version = "0.5.1"
type = "component"
group = "form"
description = "A month of days: today, a selected day or a range, disabled days, a month view; arrows, Home/End and Page Up/Down move."

[requires]
style = ">=0.5.1, <0.6.0"
rune = "bc05f817ed19488a10a6f1a928cc0521c1c70c75"

[dependencies]
registry = ["base", "icons", "button"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "calendar.rs"
target = "src/ui/calendar.rs"
sha256 = "c4ad01ef980cfc28d1b4998ebcb48de7eac8ad3dc2249458113840c8b6b01c57"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/calendar.rs"
role = "story"
sha256 = "74b696b8097af3addcf54f2b18d50a1bc10d214a7c236875accafcd61b3567aa"
