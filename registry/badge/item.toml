# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "badge"
title = "Badge"
version = "0.5.0"
type = "component"
group = "display"
description = "A small label: default, secondary, outline, destructive or a meaning, with an optional dot or count."

[requires]
style = ">=0.5.0, <0.7.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "badge.rs"
target = "src/ui/badge.rs"
sha256 = "5c394890d10ac202ca11f484b776e1575740223a1bf6d3a0b4caf73ed9a3dcf3"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/badge.rs"
role = "story"
sha256 = "8301eec4c4dd481f92e10e4c9bab73c9b14afc6bd0cda2325a6b9f7b30258e36"
