# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "badge"
title = "Badge"
version = "0.2.0"
type = "component"
group = "display"
description = "A small label: default, secondary, outline, destructive or a meaning, with an optional dot or count."

[requires]
style = ">=0.2.0, <0.3.0"
rune = "bc05f817ed19488a10a6f1a928cc0521c1c70c75"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]

[[files]]
path = "badge.rs"
target = "src/ui/badge.rs"
sha256 = "b5af453f9345c99a023fdde46880383288ba67910e83d79babd0a87cca134390"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/badge.rs"
role = "story"
sha256 = "8301eec4c4dd481f92e10e4c9bab73c9b14afc6bd0cda2325a6b9f7b30258e36"
