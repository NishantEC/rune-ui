# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "navigation_menu"
title = "NavigationMenu"
version = "0.6.0"
type = "component"
group = "overlays"
description = "A site navigation bar: links and titles that open panels of links on the shared popup; arrows across titles and panels, Escape back."

[requires]
style = ">=0.5.1, <0.10.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons", "popup"]
cargo = ["rune", "rune-ui-style", "rune-kit"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "navigation_menu.rs"
target = "src/ui/navigation_menu.rs"
sha256 = "324cd3484e14badf2dc99e9a1b37151942e5f28dca7cd996ea15ad17f09d12ac"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/navigation_menu.rs"
role = "story"
sha256 = "87c31c19cb9a723044ec104b5a8f9b5e4b37a4e0679e9e3018e741e6363d2081"
