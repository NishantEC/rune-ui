# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "tabs"
title = "Tabs"
version = "0.5.0"
type = "component"
group = "structure"
description = "Views of one place: a line under the chosen tab, or a contained well."

[requires]
style = ">=0.5.0, <0.11.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "tabs.rs"
target = "src/ui/tabs.rs"
sha256 = "3929a5b7d53b450874741d7a29ce3d0cab8466ed76234f2b9f7ac1da2f841996"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/tabs.rs"
role = "story"
sha256 = "370aada9ce0fafdf70d181600b8ae6075b641c51df448c66f4f1ba5ab9892ce2"
