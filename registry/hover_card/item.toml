# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "hover_card"
title = "HoverCard"
version = "0.8.0"
type = "component"
group = "overlays"
description = "A preview card beside a link or a name after the pointer rests on it, through the overlay layer; Return pins it, Escape hides it."

[requires]
style = ">=0.8.0, <0.11.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "hover_card.rs"
target = "src/ui/hover_card.rs"
sha256 = "51d07df7d1308c11dec5a2ef0ea1e62093f5137d095ad474f0fe8ca4ee64667f"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/hover_card.rs"
role = "story"
sha256 = "05ca376aaf8c7377b9b3b54f052eee15bead2d222ce3dda992fe8eeb06ec22d4"
