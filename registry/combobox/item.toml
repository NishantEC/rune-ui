# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "combobox"
title = "Combobox"
version = "0.2.0"
type = "component"
group = "form"
description = "One choice of many with a search: rune-kit's combobox behaviour in our look."

[requires]
style = ">=0.2.0, <0.3.0"
