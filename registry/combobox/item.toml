# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "combobox"
title = "Combobox"
version = "0.6.0"
type = "component"
group = "form"
description = "One choice of many with a search: rune-kit's combobox behaviour in our look."

[requires]
style = ">=0.5.0, <0.7.0"
rune = "bc05f817ed19488a10a6f1a928cc0521c1c70c75"

[dependencies]
registry = ["base", "icons", "popup"]
cargo = ["rune", "rune-ui-style", "rune-kit"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "combobox.rs"
target = "src/ui/combobox.rs"
sha256 = "c2f5991923dce29c5461c41825a70f74e04298d0bc28a87fd0854eb9b7b34bd9"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/combobox.rs"
role = "story"
sha256 = "60ddeec039e16cb02e0d359e05efcdffc5e787e827fe03c36aa0e8fe02903b20"
