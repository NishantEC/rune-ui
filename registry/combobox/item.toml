# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "combobox"
title = "Combobox"
version = "0.2.0"
type = "component"
group = "form"
description = "One choice of many with a search: rune-kit's combobox behaviour in our look."

[requires]
style = ">=0.2.0, <0.3.0"
rune = "bc05f817ed19488a10a6f1a928cc0521c1c70c75"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style", "rune-kit"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "combobox.rs"
target = "src/ui/combobox.rs"
sha256 = "c1e6643e07a0dc12c7647272d23c2a77b9ce0d5b3b10a3e5555755435924cb51"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/combobox.rs"
role = "story"
sha256 = "6b52e06e8e162831f250c04cec7ca95d5821a6c18f6a54f3eed3b6d852d62ded"
