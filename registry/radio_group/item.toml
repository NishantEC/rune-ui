# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "radio_group"
title = "RadioGroup"
version = "0.9.0"
type = "component"
group = "form"
description = "One of a few, shown: rings that fill with an ink dot."

[requires]
style = ">=0.5.0, <0.12.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "radio_group.rs"
target = "src/ui/radio_group.rs"
sha256 = "50e83019b4c27950da3ec7e2b4e49258730485305ce48dd926ae7000c92559e8"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/radio_group.rs"
role = "story"
sha256 = "39888a8f2631f9c0431735a0c9e3f3939000acd3074d0ec1c14c0259cb278faa"
