# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "textarea"
title = "Textarea"
version = "0.10.0"
type = "component"
group = "form"
description = "Several lines on the well material, growing with its text."

[requires]
style = ">=0.5.0, <0.10.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "textarea.rs"
target = "src/ui/textarea.rs"
sha256 = "39fe8982dc0283e8633f06b21a4f1448b6cbc866ef13e762ae9a8f774107d9a2"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/textarea.rs"
role = "story"
sha256 = "a997ee993a1e13e76ac724865f0d11cf18d9b3679f90f90f81a29155f2a9aba8"
