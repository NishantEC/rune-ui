# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "textarea"
title = "Textarea"
version = "0.11.0"
type = "component"
group = "form"
description = "Several lines on the well material, growing with its text; an optional limit and counter, and a monospaced face."

[requires]
style = ">=0.5.0, <0.11.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "textarea.rs"
target = "src/ui/textarea.rs"
sha256 = "76ee92d1504f207a8f561030f35b8a30ca190d136b29ec248c0380e5e3faf9a1"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/textarea.rs"
role = "story"
sha256 = "4cc2bcdc248b6fb9a391da110d2e16d49d8dca93f17914dbaf046594981dcead"
