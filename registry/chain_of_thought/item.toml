# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "chain_of_thought"
title = "ChainOfThought"
version = "0.6.0"
type = "component"
group = "agent"
description = "The steps an agent took behind one Worked for 2m 14s line: each with its mark, words and detail."

[requires]
style = ">=0.6.0, <0.7.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons", "agent", "shimmer"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "chain_of_thought.rs"
target = "src/ui/chain_of_thought.rs"
sha256 = "f952e761831d9f186b2e1f68e5785faf046f861601c513db6206ad1a58c67e78"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/chain_of_thought.rs"
role = "story"
sha256 = "d51e24fc4af0b21f47263ec081e4a7404309067ac917e0dc3c8c816dccf25f79"
