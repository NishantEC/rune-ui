# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "terminal"
title = "Terminal"
version = "0.8.0"
type = "component"
group = "agent"
description = "A command and its output on the slab, with its running state, exit status and time."

[requires]
style = ">=0.8.0, <0.9.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons", "agent"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "terminal.rs"
target = "src/ui/terminal.rs"
sha256 = "5c9ee623a1767dc1d8c8cd8f864504867271a982fe2023e61ffc81617d7b136c"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/terminal.rs"
role = "story"
sha256 = "ea431ac46b3e091ac4e12e7751558ec34aee2e092b3a2d5296775d460f7b90b4"
