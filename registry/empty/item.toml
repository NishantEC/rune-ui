# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "empty"
title = "Empty"
version = "0.5.0"
type = "component"
group = "display"
description = "Nothing here yet: what is missing, why, and the one thing to do."

[requires]
style = ">=0.5.0, <0.12.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = ["button"]

[[files]]
path = "empty.rs"
target = "src/ui/empty.rs"
sha256 = "46181f969e2506b237862883288d6f6e0b42efd60bb6f0f173a36e0d29752dac"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/empty.rs"
role = "story"
sha256 = "4cf4880770eeafaaf93ab2899863d8b44f41b7de8fc6845e2b01525be7ea09f5"
