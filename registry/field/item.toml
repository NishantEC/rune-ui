# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "field"
title = "Field"
version = "0.4.0"
type = "component"
group = "form"
description = "A label, a control, and its description or error, laid out together."

[requires]
style = ">=0.4.0, <0.5.0"
rune = "bc05f817ed19488a10a6f1a928cc0521c1c70c75"

[dependencies]
registry = ["base", "icons", "label"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = ["input"]

[[files]]
path = "field.rs"
target = "src/ui/field.rs"
sha256 = "70705bd0ee75c52dd376051e103291aa3fd7c53779fd4537f013c7cedb73fa60"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/field.rs"
role = "story"
sha256 = "d2df19cc5348c70a28f8e76603af777690b192c7281727ea09716297541364ea"
