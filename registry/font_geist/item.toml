# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "font_geist"
title = "Geist"
version = "0.8.0"
type = "font"
group = "fonts"
description = "A crisp, technical grotesque from Vercel, made for developer tools and dashboards. Variable weight 100 to 900."

[requires]
style = ">=0.5.0, <0.9.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
# Rune replaces its built-in Inter with an app's own fonts, so every font brings Inter along.
registry = ["font_inter"]
cargo = ["rune-ui-style"]

[font]
token = "geist"
family = "Geist"
licence = "OFL-1.1"
font_version = "Version 1.800"
source = "https://github.com/google/fonts/tree/83c62e30d87daa70216dab6b984d00d20d96d585/ofl/geist/Geist%5Bwght%5D.ttf"
upstream = "https://github.com/vercel/geist-font"
bytes = 169056
size_adjust = 1.03

[[files]]
path = "font_geist.rs"
target = "src/ui/font_geist/mod.rs"
sha256 = "0972ea6c7261d4a66079981a906aaa58b49b7cdcb2b292d4e334baeaf962592c"

[[files]]
path = "Geist-Variable.ttf"
target = "src/ui/font_geist/Geist-Variable.ttf"
