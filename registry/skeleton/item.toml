# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "skeleton"
title = "Skeleton"
version = "0.8.0"
type = "component"
group = "display"
description = "The still shape of what is loading."

[requires]
style = ">=0.5.0, <0.10.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "skeleton.rs"
target = "src/ui/skeleton.rs"
sha256 = "b81989548988882c4d7dcae26c98aab0bef600795c3864df0d57816e1761fb6a"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/skeleton.rs"
role = "story"
sha256 = "920ff4eee69bbee16bf9a9bc3a5f9e10ce29f0018a6e2639a1dc5dcacbf80396"
