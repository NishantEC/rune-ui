# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "font_ibm_plex_sans"
title = "IBM Plex Sans"
version = "0.5.0"
type = "font"
group = "fonts"
description = "A grotesque with engineered, slightly quirky details, at home in enterprise tools. Variable weight 100 to 700 and width 75 to 100 (drawn at 100). 'Plex' is a Reserved Font Name: ship the file unmodified."

[requires]
style = ">=0.5.0, <0.7.0"
rune = "bc05f817ed19488a10a6f1a928cc0521c1c70c75"

[dependencies]
# Rune replaces its built-in Inter with an app's own fonts, so every font brings Inter along.
registry = ["font_inter"]
cargo = ["rune-ui-style"]

[font]
token = "ibm-plex-sans"
family = "IBM Plex Sans"
licence = "OFL-1.1"
font_version = "Version 3.201"
source = "https://github.com/google/fonts/tree/83c62e30d87daa70216dab6b984d00d20d96d585/ofl/ibmplexsans/IBMPlexSans%5Bwdth,wght%5D.ttf"
upstream = "https://github.com/googlefonts/plex"
bytes = 537244
size_adjust = 1.05

[[files]]
path = "font_ibm_plex_sans.rs"
target = "src/ui/font_ibm_plex_sans/mod.rs"
sha256 = "0dfed8ce1a7a523e9f16d69a87baf256c23c4856caf57e5be14f0354cc902c3f"

[[files]]
path = "IBMPlexSans-Variable.ttf"
target = "src/ui/font_ibm_plex_sans/IBMPlexSans-Variable.ttf"
sha256 = "3b031aa4216174205bd8471f88a49b91f093169e9e87bd5262242bc5967fe2e3"

