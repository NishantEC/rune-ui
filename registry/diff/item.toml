# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "diff"
title = "Diff"
version = "0.8.0"
type = "component"
group = "agent"
description = "A unified diff per file: a folding header with the path and +n \u2212n, added and removed lines on their washes."

[requires]
style = ">=0.6.0, <0.10.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons", "agent"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "diff.rs"
target = "src/ui/diff.rs"
sha256 = "5b333632736fea94300570e48c9a007d6fd78465152713b7fa81c97d50138490"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/diff.rs"
role = "story"
sha256 = "c8983fdfc62f412d4a5af7f7b89a9948a852714e7223abf3784574ea69fddd2e"
