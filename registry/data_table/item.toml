# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "data_table"
title = "DataTable"
version = "0.8.0"
type = "component"
group = "structure"
description = "Table with sortable headers, row checkboxes, a Columns menu, pages, a sticky header over a scrolling body, loading and empty states."

[requires]
style = ">=0.5.1, <0.12.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons", "table", "checkbox", "pagination", "popup", "button"]
cargo = ["rune", "rune-ui-style", "rune-kit"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "data_table.rs"
target = "src/ui/data_table.rs"
sha256 = "51a03e4d306c6b4dc08c840df803be2da958a0a3ba102356d16e72a572170ea5"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/data_table.rs"
role = "story"
sha256 = "b6ef401ce3521b5b6ef980d2b785edc011dd58621f2fd09fe7ed21308cc69125"
