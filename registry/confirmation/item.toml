# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "confirmation"
title = "Confirmation"
version = "0.10.0"
type = "component"
group = "agent"
description = "A tool call asking permission: Allow once, Always allow or Deny by press or key, an optional why line and a destructive form; answered, a quiet line."

[requires]
style = ">=0.6.0, <0.11.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons", "agent", "button"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "confirmation.rs"
target = "src/ui/confirmation.rs"
sha256 = "1a7f019be06ebb22455c2f5bacee9ff98b5d3f7133b58f022a22f160f8166929"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/confirmation.rs"
role = "story"
sha256 = "cccc6f91aa8dd0e5046d2c3159fe402dc36c28ebfeabf6e3bfc006f80c721a69"
