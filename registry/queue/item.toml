# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "queue"
title = "Queue"
version = "0.6.0"
type = "component"
group = "agent"
description = "Messages waiting to be sent: rows moved with Alt and the arrows, removed with Delete or their button."

[requires]
style = ">=0.6.0, <0.12.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons", "agent"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "queue.rs"
target = "src/ui/queue.rs"
sha256 = "7eaa8f8bedd89dde75cf7ec470a45fbfb191647bf29a9d007c018836be4ef393"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/queue.rs"
role = "story"
sha256 = "9fad7e944b4b1ca72d853151629af0e90c1608fae5baaa54e5a031be5f366895"
