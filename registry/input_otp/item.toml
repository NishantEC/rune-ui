# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "input_otp"
title = "InputOTP"
version = "0.5.1"
type = "component"
group = "form"
description = "A one-time code in grouped slots: type to fill and move on, Backspace back, arrows between slots, one Tab stop."

[requires]
style = ">=0.5.1, <0.8.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "input_otp.rs"
target = "src/ui/input_otp.rs"
sha256 = "4a25c49b1349501b32c06da330fea53312a85217f605007e2bbb4a4ba6ca5912"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/input_otp.rs"
role = "story"
sha256 = "3b0eacdef68bf36b6165f1dbe36aabc9cc6a7caf2e41f97947632c60e2923357"
