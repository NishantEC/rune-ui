# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "separator"
title = "Separator"
version = "0.4.0"
type = "component"
group = "structure"
description = "A hairline between groups, across or down, with optional words."

[requires]
style = ">=0.4.0, <0.5.0"
rune = "bc05f817ed19488a10a6f1a928cc0521c1c70c75"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "separator.rs"
target = "src/ui/separator.rs"
sha256 = "6d6f5b67db0e3da010e001c22b5ddd2f766640b94b0a6deb8e034b82d9d1d435"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/separator.rs"
role = "story"
sha256 = "ad91f582ab75d007db434955a787cdfcaa2d01c8f501f42c19196e0f6c2821b0"
