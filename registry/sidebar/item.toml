# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "sidebar"
title = "Sidebar"
version = "0.9.0"
type = "component"
group = "structure"
description = "An app's side column: header, labelled groups of rows with icons (or status marks) and counts, lists for assistive technology, footer."

[requires]
style = ">=0.5.0, <0.10.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "sidebar.rs"
target = "src/ui/sidebar.rs"
sha256 = "c6697abfc6611a670c95a96671fbecc0d648d4f55a7db1293e502b4d515503fb"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/sidebar.rs"
role = "story"
sha256 = "3c93ea4bc287a6b2a6e05ab8530c10f3359542409ff9d89af49d73d9ffd59c2f"
