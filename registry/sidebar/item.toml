# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "sidebar"
title = "Sidebar"
version = "0.5.0"
type = "component"
group = "structure"
description = "An app's side column: header, labelled groups of rows with icons and counts, footer."

[requires]
style = ">=0.5.0, <0.9.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "sidebar.rs"
target = "src/ui/sidebar.rs"
sha256 = "93fe7a682009da309cb1a27e214f9b500ee7f2ff57c67a25e40f2ed0abf0c8b4"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/sidebar.rs"
role = "story"
sha256 = "1c5e85036ffb1ef2021827385db182d2809340fc8538be35888fe2fe2d8f2f54"
