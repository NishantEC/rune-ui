# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "sidebar"
title = "Sidebar"
version = "0.11.0"
type = "component"
group = "structure"
description = "An app's side column: header, labelled groups of rows with icons (or status marks) and counts, two-line rows with a second line of your own parts, unread titles, a trailing slot that swaps under the pointer and nested rows; lists for assistive technology, footer."

[requires]
style = ">=0.5.0, <0.12.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = ["portrait"]

[[files]]
path = "sidebar.rs"
target = "src/ui/sidebar.rs"
sha256 = "ad622b74498c832e6502a95b21d8f35d3a07e058af907b854c43ab7859a93405"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/sidebar.rs"
role = "story"
sha256 = "353e984470956d0a1c979d3680e2ab455d6f1bbc206947f89a9326cb3db81316"
