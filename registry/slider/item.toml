# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "slider"
title = "Slider"
version = "0.5.0"
type = "component"
group = "form"
description = "A value in a range: a well track, an ink fill and a raised thumb; drag or arrow keys."

[requires]
style = ">=0.5.0, <0.11.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "slider.rs"
target = "src/ui/slider.rs"
sha256 = "5c7c3fcc84796fcf86aa1b0662ae1009d709db2ee930f33a75b94259689130ae"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/slider.rs"
role = "story"
sha256 = "7bbe63926897f1903dda66ae8947a71f957754e71545d22278842cf660059f92"
