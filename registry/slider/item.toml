# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "slider"
title = "Slider"
version = "0.2.0"
type = "component"
group = "form"
description = "A value in a range: a well track, an ink fill and a raised thumb; drag or arrow keys."

[requires]
style = ">=0.2.0, <0.3.0"
rune = "bc05f817ed19488a10a6f1a928cc0521c1c70c75"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]

[[files]]
path = "slider.rs"
target = "src/ui/slider.rs"
sha256 = "56e37ebc68ba9b51f439f9bdb2656d5bd8f2b9b94fc07f7081d3d37676e8aace"

