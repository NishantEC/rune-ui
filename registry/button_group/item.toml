# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "button_group"
title = "ButtonGroup"
version = "0.5.0"
type = "component"
group = "actions"
description = "Related actions joined into one raised object divided by hairlines."

[requires]
style = ">=0.5.0, <0.9.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "button_group.rs"
target = "src/ui/button_group.rs"
sha256 = "6b7781f5d5d8246c2777ac440e112754d4482b32ca705fdcf56caf48183a1597"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/button_group.rs"
role = "story"
