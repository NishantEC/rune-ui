# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "alert"
title = "Alert"
version = "0.8.0"
type = "component"
group = "display"
description = "A message in a meaning's wash: icon, title, description, an action."

[requires]
style = ">=0.5.0, <0.12.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = ["button"]

[[files]]
path = "alert.rs"
target = "src/ui/alert.rs"
sha256 = "96579aa49f65d5c41adf642988cdd1d5b1fe764a2149e68a6a5be4dafbe19573"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/alert.rs"
role = "story"
sha256 = "9dc541e4b4fabd5756ec4945b09db06e5980d0698946614f1187c757d0412d74"
