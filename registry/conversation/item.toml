# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "conversation"
title = "Conversation"
version = "0.6.0"
type = "component"
group = "agent"
description = "The scroll area a chat lives in: pinned to the newest content until the reader scrolls up, then a Jump to latest pill; a reading column; an empty state."

[requires]
style = ">=0.6.0, <0.8.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = ["message"]

[[files]]
path = "conversation.rs"
target = "src/ui/conversation.rs"
sha256 = "ff3397ca6d0b38b101926f08a9279c418c4695d17e6700c00cb7f27f2157d6b0"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/conversation.rs"
role = "story"
sha256 = "d99e76b3e1e9a8c849c9e4dbacc804fef8e60828d1495de629e9e882087a2bcf"
