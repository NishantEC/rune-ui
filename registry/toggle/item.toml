# rune-ui registry item (schema 1). `rune-ui registry hash` refreshes the sha256 values; the registry test fails if they drift.
schema = 1
name = "toggle"
title = "Toggle"
version = "0.5.0"
type = "component"
group = "actions"
description = "A two-state button: quiet until hovered, the selected wash when on."

[requires]
style = ">=0.5.0, <0.8.0"
rune = "53f6d36a96439d357a6f2a2560383d7b9e9ec9c2"

[dependencies]
registry = ["base", "icons"]
cargo = ["rune", "rune-ui-style"]
# What the stories use besides this item: they are copied only when these are installed too.
stories = []

[[files]]
path = "toggle.rs"
target = "src/ui/toggle.rs"
sha256 = "fe32ab3fc76d09a06749081e6b268630bd3c1bc5cae00f9251e3db3369c315c0"

# Copied only once the gallery block is installed.
[[files]]
path = "stories.rs"
target = "src/ui/stories/toggle.rs"
role = "story"
sha256 = "51f900aa107545663af07fc58897c2a056db9dcaba949cdf10b042c1c7795983"
